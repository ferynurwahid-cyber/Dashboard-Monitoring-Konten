<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dashboard Monitoring Konten</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',sans-serif;background:#f4f8fd;color:#1a2a3a}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
tr:hover td{background:#f0f6fc!important}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#2e7dd1;border-radius:4px}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { createClient } = supabase;
const sb = createClient(
  'https://vylpaoazxdvkjzqlqefz.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5bHBhb2F6eGR2a2p6cWxxZWZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5OTAxMjIsImV4cCI6MjA4ODU2NjEyMn0.IbL1sQ0EA_swhkLp4phukBj8IJRocNvQx4ptWnumOzs'
);

const { useState, useEffect, useCallback } = React;

const STATUS_COLOR = {
  "Dipublikasikan": { bg:"#e8f5ee", text:"#1a7a4a", dot:"#22c55e" },
  "Selesai":        { bg:"#dbeafe", text:"#1e40af", dot:"#3b82f6" },
  "Dalam proses":   { bg:"#fff3e0", text:"#c96b00", dot:"#fb923c" },
  "Dalam peninjauan":{ bg:"#ede9fe",text:"#6d28d9", dot:"#a78bfa" },
  "Baru":           { bg:"#f1f5f9", text:"#64748b", dot:"#94a3b8" },
};
const PIC_COLOR = { Anhar:"#e05c3a", Sabin:"#1b5ea6", Sandi:"#1a7a4a" };
const JENIS_OPTS   = ["ESI","GCI","SLH","VOESI","ESI, GCI","ESI, SLH","VOESI, ESI","VOESI, GCI","Desain Proposal","Desain Cover","Desain lainnya"];
const PILAR_OPTS   = ["Jejak Perjalanan","Strategic Knowledge & Methodology","Corporate Collaboration & Multi-Stakeholder Approach","People & Expertise","Big Days","Compliance, Regulation & Standards Update","Cerita Manusia","Youth Action & Changemakers","Youth Culture & Social Meaning","Youth Perspective & Thought Piece","5 Tenggo","Design"];
const PLATFORM_OPTS= ["Instagram","TikTok","Instagram, Linkedin","Linkedin, Instagram","Design"];
const FORMAT_OPTS  = ["Reels","Feeds","Poster","Carousel","Story","Talking Head/Reels","Dokumenter video","PPT","Proposal"];
const STATUS_OPTS  = ["Baru","Dalam proses","Dalam peninjauan","Selesai","Dipublikasikan"];
const PER = 12;

const fmtDate = t => t ? new Date(t).toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}) : "—";
const countBy = (data,key) => {
  const m={};
  data.forEach(d=>{ if(d[key]) m[d[key]]=(m[d[key]]||0)+1; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({k,v}));
};

function Badge({status}){
  const c=STATUS_COLOR[status]||STATUS_COLOR["Baru"];
  return <span style={{background:c.bg,color:c.text,padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:600,display:"inline-flex",alignItems:"center",gap:5,whiteSpace:"nowrap"}}>
    <span style={{width:6,height:6,borderRadius:"50%",background:c.dot}}/>
    {status||"—"}
  </span>;
}

function PicChip({pic}){
  return <span style={{display:"inline-flex",alignItems:"center",gap:5,background:"#eaf3fd",padding:"2px 8px 2px 3px",borderRadius:20,fontSize:11,color:"#1b5ea6",fontWeight:500}}>
    <span style={{width:18,height:18,borderRadius:"50%",background:PIC_COLOR[pic]||"#aaa",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700}}>{pic?pic[0]:"?"}</span>
    {pic||"—"}
  </span>;
}

function BarChart({data,color="#2e7dd1"}){
  const max=Math.max(...data.map(d=>d.v),1);
  return <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:12}}>
    {data.map(({k,v})=>(
      <div key={k}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:11.5,marginBottom:3}}>
          <span style={{color:"#1a2a3a",fontWeight:500,maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={k}>{k}</span>
          <span style={{color:"#5a7a9a",fontWeight:600}}>{v}</span>
        </div>
        <div style={{background:"#eaf3fd",borderRadius:4,height:7}}>
          <div style={{height:"100%",width:`${(v/max)*100}%`,background:color,borderRadius:4,transition:"width 0.8s"}}/>
        </div>
      </div>
    ))}
  </div>;
}

function DonutChart({data}){
  const colors=["#1a7a4a","#1e40af","#c96b00","#6d28d9","#64748b"];
  const total=data.reduce((s,d)=>s+d.v,0)||1;
  let offset=-90;
  const paths=data.map((d,i)=>{
    if(!d.v) return null;
    const angle=(d.v/total)*360;
    const r=40,cx=55,cy=55,large=angle>180?1:0;
    const x1=cx+r*Math.cos(offset*Math.PI/180),y1=cy+r*Math.sin(offset*Math.PI/180);
    const x2=cx+r*Math.cos((offset+angle)*Math.PI/180),y2=cy+r*Math.sin((offset+angle)*Math.PI/180);
    const el=<path key={d.k} d={`M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 ${large} 1 ${x2} ${y2}Z`} fill={colors[i]} opacity={0.9}/>;
    offset+=angle; return el;
  });
  return <div style={{display:"flex",alignItems:"center",gap:16,marginTop:12}}>
    <svg width={110} height={110} viewBox="0 0 110 110" style={{flexShrink:0}}>
      {paths}
      <circle cx={55} cy={55} r={31} fill="white"/>
      <text x={55} y={60} textAnchor="middle" fontSize={16} fontWeight={600} fill="#1b5ea6" fontFamily="Georgia,serif">{total}</text>
    </svg>
    <div style={{flex:1}}>
      {data.map((d,i)=>d.v?<div key={d.k} style={{display:"flex",justifyContent:"space-between",fontSize:11.5,marginBottom:6}}>
        <span style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:8,height:8,borderRadius:"50%",background:colors[i],flexShrink:0}}/>{d.k}</span>
        <span style={{color:"#5a7a9a",fontWeight:600}}>{d.v} <small>({Math.round(d.v/total*100)}%)</small></span>
      </div>:null)}
    </div>
  </div>;
}

function MonthBars({data}){
  const max=Math.max(...data.map(d=>d.v),1);
  return <div style={{marginTop:12}}>
    <div style={{display:"flex",alignItems:"flex-end",gap:6,height:80}}>
      {data.map(({k,v})=>(
        <div key={k} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
          <span style={{fontSize:10,fontWeight:600,color:"#1b5ea6"}}>{v||""}</span>
          <div style={{width:"100%",height:Math.max(6,(v/max)*66),background:"linear-gradient(180deg,#2e7dd1,#1b5ea6)",borderRadius:"4px 4px 0 0"}}/>
        </div>
      ))}
    </div>
    <div style={{display:"flex",gap:6,marginTop:5}}>
      {data.map(({k})=><div key={k} style={{flex:1,textAlign:"center",fontSize:9.5,color:"#5a7a9a"}}>{k}</div>)}
    </div>
  </div>;
}

function Card({children,style={}}){
  return <div style={{background:"#fff",borderRadius:14,padding:"18px 20px",boxShadow:"0 2px 16px rgba(30,94,166,0.09)",border:"1px solid #cde0f5",...style}}>{children}</div>;
}
function STitle({children}){
  return <div style={{display:"flex",alignItems:"center",gap:8,fontSize:13,fontWeight:600,color:"#1b5ea6"}}>
    <div style={{width:3,height:16,background:"#2e7dd1",borderRadius:2}}/>{children}
  </div>;
}

const inp={width:"100%",padding:"9px 12px",border:"1.5px solid #cde0f5",borderRadius:8,fontFamily:"inherit",fontSize:13,color:"#1a2a3a",background:"#f4f8fd",outline:"none",boxSizing:"border-box"};
const th={background:"#eaf3fd",padding:"10px 14px",textAlign:"left",fontSize:10.5,letterSpacing:"0.8px",textTransform:"uppercase",color:"#1b5ea6",fontWeight:600,borderBottom:"1px solid #cde0f5",whiteSpace:"nowrap"};
const td0={padding:"10px 14px",fontSize:12.5,borderBottom:"1px solid #eaf3fd",verticalAlign:"middle"};

function App(){
  const [data,setData]=useState([]);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);
  const [view,setView]=useState("dashboard");
  const [drawer,setDrawer]=useState(false);
  const [modal,setModal]=useState(null);
  const [toast,setToast]=useState(null);
  const [sync,setSync]=useState(false);
  const [search,setSearch]=useState("");
  const [fStatus,setFStatus]=useState("");
  const [fJenis,setFJenis]=useState("");
  const [fPIC,setFPIC]=useState("");
  const [page,setPage]=useState(1);
  const [saving,setSaving]=useState(false);
  const [form,setForm]=useState({judul:"",jenis:"",pilar:"",platform:"",format:"",pic:"",status:"",tanggal:"",link:""});

  const loadData=useCallback(async()=>{
    const {data:rows,error:err}=await sb.from("konten").select("*").order("created_at",{ascending:false});
    if(err){setError(err.message);return;}
    setData(rows||[]);
  },[]);

  useEffect(()=>{loadData().finally(()=>setLoading(false));},[loadData]);

  useEffect(()=>{
    const ch=sb.channel("konten-ch")
      .on("postgres_changes",{event:"*",schema:"public",table:"konten"},()=>{
        loadData();setSync(true);setTimeout(()=>setSync(false),3000);
      }).subscribe();
    return ()=>sb.removeChannel(ch);
  },[loadData]);

  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3200);};

  const handleAdd=async()=>{
    if(!form.judul.trim()){showToast("⚠️ Judul wajib diisi","error");return;}
    if(!form.status){showToast("⚠️ Status wajib dipilih","error");return;}
    setSaving(true);
    const {error:err}=await sb.from("konten").insert([{...form,tanggal:form.tanggal||null}]);
    setSaving(false);
    if(err){showToast("❌ Gagal: "+err.message,"error");return;}
    setForm({judul:"",jenis:"",pilar:"",platform:"",format:"",pic:"",status:"",tanggal:"",link:""});
    setDrawer(false);showToast(`✅ "${form.judul}" ditambahkan!`);
  };

  const total=data.length,pub=data.filter(d=>d.status==="Dipublikasikan").length,
    prog=data.filter(d=>d.status==="Dalam proses").length,
    baru=data.filter(d=>["Baru","Dalam peninjauan"].includes(d.status)).length,
    selesai=data.filter(d=>d.status==="Selesai").length;

  const statusData=[
    {k:"Dipublikasikan",v:pub},{k:"Selesai",v:selesai},{k:"Dalam proses",v:prog},
    {k:"Dalam peninjauan",v:data.filter(d=>d.status==="Dalam peninjauan").length},
    {k:"Baru",v:data.filter(d=>d.status==="Baru").length},
  ];
  const monthData=["2025-11","2025-12","2026-01","2026-02","2026-03"].map((ym,i)=>({
    k:["Nov'25","Des'25","Jan'26","Feb'26","Mar'26"][i],
    v:data.filter(d=>d.tanggal?.startsWith(ym)).length
  }));

  const filtered=data.filter(d=>{
    const q=search.toLowerCase();
    return(!q||(d.judul+d.jenis+d.pilar+d.format).toLowerCase().includes(q))
      &&(!fStatus||d.status===fStatus)&&(!fJenis||d.jenis===fJenis)&&(!fPIC||d.pic===fPIC);
  });
  const totalPages=Math.ceil(filtered.length/PER);
  const paged=filtered.slice((page-1)*PER,page*PER);
  const recent=[...data].filter(d=>d.tanggal).sort((a,b)=>b.tanggal.localeCompare(a.tanggal)).slice(0,8);

  if(loading) return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",background:"#f4f8fd",gap:16}}>
    <div style={{fontSize:38,animation:"spin 1s linear infinite"}}>⚙️</div>
    <div style={{fontFamily:"Georgia,serif",fontSize:22,color:"#1b5ea6"}}>Dashboard Konten</div>
    <div style={{fontSize:13,color:"#5a7a9a"}}>Memuat data dari Supabase…</div>
  </div>;

  if(error) return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",gap:12}}>
    <div style={{fontSize:36}}>❌</div>
    <div style={{fontSize:16,color:"#b91c1c",fontWeight:600}}>Koneksi ke Supabase gagal</div>
    <div style={{fontSize:13,color:"#5a7a9a"}}>{error}</div>
  </div>;

  return <div style={{fontFamily:"'Sora',sans-serif",background:"#f4f8fd",minHeight:"100vh"}}>
    {/* TOPBAR */}
    <div style={{background:"#1b5ea6",padding:"0 24px",display:"flex",alignItems:"center",justifyContent:"space-between",height:58,position:"sticky",top:0,zIndex:200,boxShadow:"0 2px 20px rgba(27,94,166,0.35)"}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <div style={{width:34,height:34,background:"rgba(255,255,255,0.15)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>📊</div>
        <div>
          <div style={{fontFamily:"Georgia,serif",fontSize:16,fontWeight:500,color:"#fff"}}>Monitoring Konten</div>
          <div style={{fontSize:10.5,color:"rgba(255,255,255,0.65)"}}>Content Intelligence Dashboard</div>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        {["dashboard","table"].map((v,i)=>(
          <button key={v} onClick={()=>setView(v)} style={{padding:"6px 14px",borderRadius:6,fontSize:12.5,fontWeight:500,border:"none",background:view===v?"rgba(255,255,255,0.2)":"none",color:view===v?"#fff":"rgba(255,255,255,0.6)"}}>
            {["Dashboard","Semua Konten"][i]}
          </button>
        ))}
        <button onClick={()=>setDrawer(true)} style={{display:"flex",alignItems:"center",gap:6,padding:"7px 16px",background:"#fff",border:"none",borderRadius:7,color:"#1b5ea6",fontSize:12.5,fontWeight:600}}>
          ＋ Tambah Konten
        </button>
        <div style={{display:"flex",alignItems:"center",gap:6,background:"rgba(255,255,255,0.12)",border:"1px solid rgba(255,255,255,0.2)",padding:"5px 12px",borderRadius:20,fontSize:11.5,color:"rgba(255,255,255,0.9)"}}>
          <span style={{width:7,height:7,borderRadius:"50%",background:"#4ade80",boxShadow:"0 0 8px #4ade80"}}/>
          {data.length} konten · Live
        </div>
      </div>
    </div>

    {sync&&<div style={{position:"fixed",top:68,left:"50%",transform:"translateX(-50%)",background:"#1a7a4a",color:"#fff",padding:"8px 18px",borderRadius:20,fontSize:12.5,fontWeight:600,zIndex:8000,animation:"fadeUp 0.3s"}}>
      🔄 Konten baru masuk!
    </div>}

    <div style={{maxWidth:1360,margin:"0 auto",padding:"22px 20px"}}>
      {view==="dashboard"&&<>
        {/* STAT CARDS */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:12,marginBottom:20}}>
          {[
            {label:"Total Konten",val:total,sub:"semua data",acc:"#1b5ea6"},
            {label:"Dipublikasikan",val:pub,sub:`${total?Math.round(pub/total*100):0}% dari total`,acc:"#1a7a4a"},
            {label:"Dalam Proses",val:prog,sub:"sedang dikerjakan",acc:"#c96b00"},
            {label:"Baru / Peninjauan",val:baru,sub:"menunggu action",acc:"#6d28d9"},
            {label:"Selesai",val:selesai,sub:"sudah selesai",acc:"#2e7dd1"},
          ].map((c,i)=>(
            <Card key={i} style={{position:"relative",overflow:"hidden",animation:`fadeUp 0.3s ${i*0.07}s both`}}>
              <div style={{position:"absolute",bottom:0,left:0,right:0,height:3,background:c.acc,borderRadius:"0 0 14px 14px"}}/>
              <div style={{fontSize:10.5,letterSpacing:"0.8px",textTransform:"uppercase",color:"#5a7a9a",fontWeight:500,marginBottom:6}}>{c.label}</div>
              <div style={{fontFamily:"Georgia,serif",fontSize:34,fontWeight:500,color:c.acc,lineHeight:1,marginBottom:3}}>{c.val}</div>
              <div style={{fontSize:11.5,color:"#5a7a9a"}}>{c.sub}</div>
            </Card>
          ))}
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14,marginBottom:18}}>
          <Card><STitle>Status Konten</STitle><DonutChart data={statusData}/></Card>
          <Card><STitle>Per PIC</STitle><BarChart data={countBy(data,"pic").filter(d=>d.k)} color="#1b5ea6"/></Card>
          <Card><STitle>Aktivitas Bulanan</STitle><MonthBars data={monthData}/></Card>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:18}}>
          <Card><STitle>Per Jenis / Divisi</STitle><BarChart data={countBy(data,"jenis").filter(d=>d.k).slice(0,8)} color="#2e7dd1"/></Card>
          <Card><STitle>Per Pilar</STitle><BarChart data={countBy(data,"pilar").filter(d=>d.k).slice(0,8)} color="#1a7a4a"/></Card>
        </div>

        <Card style={{marginBottom:18}}>
          <STitle>Per Platform</STitle>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:14}}>
            {countBy(data,"platform").filter(d=>d.k).map(({k,v})=>(
              <div key={k} onClick={()=>setView("table")} style={{display:"flex",alignItems:"center",gap:8,background:"#eaf3fd",border:"1px solid #cde0f5",borderRadius:10,padding:"10px 16px",cursor:"pointer"}}>
                <span style={{fontSize:18}}>{k==="Instagram"?"📸":k==="TikTok"?"🎵":k==="Design"?"🎨":"🔗"}</span>
                <div>
                  <div style={{fontSize:13,fontWeight:600,color:"#1b5ea6"}}>{k}</div>
                  <div style={{fontSize:11,color:"#5a7a9a"}}>{v} konten</div>
                </div>
              </div>
            ))}
          </div>
        </Card>

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <STitle>Konten Terbaru</STitle>
          <button onClick={()=>setView("table")} style={{fontSize:12,color:"#2e7dd1",background:"none",border:"none"}}>Lihat semua →</button>
        </div>
        <Card style={{overflow:"hidden",padding:0}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead><tr>{["Judul","Jenis","PIC","Status","Tanggal"].map(h=><th key={h} style={th}>{h}</th>)}</tr></thead>
            <tbody>
              {recent.map((r,i)=>(
                <tr key={r.id||i} onClick={()=>setModal(r)} style={{cursor:"pointer"}}>
                  <td style={{...td0,fontWeight:500}}>{r.judul||"—"}</td>
                  <td style={{...td0,color:"#5a7a9a"}}>{r.jenis||"—"}</td>
                  <td style={td0}><PicChip pic={r.pic}/></td>
                  <td style={td0}><Badge status={r.status}/></td>
                  <td style={{...td0,color:"#5a7a9a"}}>{fmtDate(r.tanggal)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </Card>
      </>}

      {view==="table"&&(
        <Card style={{overflow:"hidden",padding:0}}>
          <div style={{display:"flex",alignItems:"center",gap:8,padding:"14px 18px",borderBottom:"1px solid #cde0f5",flexWrap:"wrap"}}>
            <div style={{position:"relative",flex:1,minWidth:180,maxWidth:260}}>
              <span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",color:"#5a7a9a"}}>🔍</span>
              <input value={search} onChange={e=>{setSearch(e.target.value);setPage(1);}} placeholder="Cari konten…" style={{...inp,paddingLeft:30}}/>
            </div>
            {[
              {val:fStatus,set:setFStatus,opts:STATUS_OPTS,ph:"Semua Status"},
              {val:fJenis,set:setFJenis,opts:JENIS_OPTS,ph:"Semua Jenis"},
              {val:fPIC,set:setFPIC,opts:["Anhar","Sabin","Sandi"],ph:"Semua PIC"},
            ].map((f,i)=>(
              <select key={i} value={f.val} onChange={e=>{f.set(e.target.value);setPage(1);}} style={{...inp,width:"auto"}}>
                <option value="">{f.ph}</option>
                {f.opts.map(o=><option key={o}>{o}</option>)}
              </select>
            ))}
            <span style={{marginLeft:"auto",fontSize:11.5,color:"#5a7a9a"}}>{filtered.length} konten</span>
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5}}>
              <thead><tr>{["#","Judul","Jenis","Pilar","Platform","Format","PIC","Status","Tanggal","Link"].map(h=><th key={h} style={th}>{h}</th>)}</tr></thead>
              <tbody>
                {paged.length===0?<tr><td colSpan={10} style={{textAlign:"center",padding:48,color:"#5a7a9a"}}>🔍 Tidak ada konten</td></tr>
                :paged.map((r,i)=>(
                  <tr key={r.id||i} onClick={()=>setModal(r)} style={{cursor:"pointer"}}>
                    <td style={{...td0,color:"#5a7a9a"}}>{(page-1)*PER+i+1}</td>
                    <td style={{...td0,fontWeight:500,maxWidth:180}}>{r.judul||"—"}</td>
                    <td style={{...td0,color:"#5a7a9a",whiteSpace:"nowrap"}}>{r.jenis||"—"}</td>
                    <td style={{...td0,maxWidth:150,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={r.pilar}>{r.pilar||"—"}</td>
                    <td style={{...td0,color:"#5a7a9a"}}>{r.platform||"—"}</td>
                    <td style={{...td0,color:"#5a7a9a",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.format||"—"}</td>
                    <td style={td0}><PicChip pic={r.pic}/></td>
                    <td style={td0}><Badge status={r.status}/></td>
                    <td style={{...td0,color:"#5a7a9a",whiteSpace:"nowrap"}}>{fmtDate(r.tanggal)}</td>
                    <td style={td0} onClick={e=>e.stopPropagation()}>
                      {r.link?.startsWith("http")?<a href={r.link} target="_blank" rel="noreferrer" style={{fontSize:11,color:"#2e7dd1",padding:"3px 8px",border:"1px solid #cde0f5",borderRadius:5,textDecoration:"none"}}>🔗</a>:<span style={{color:"#ccc"}}>—</span>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 18px",borderTop:"1px solid #cde0f5",fontSize:12,color:"#5a7a9a"}}>
            <span>{filtered.length===0?"Tidak ada hasil":`${(page-1)*PER+1}–${Math.min(page*PER,filtered.length)} dari ${filtered.length}`}</span>
            <div style={{display:"flex",gap:4}}>
              <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1} style={{padding:"4px 10px",border:"1px solid #cde0f5",borderRadius:6,background:"#fff",color:page===1?"#ccc":"#1b5ea6",fontSize:13}}>‹</button>
              {Array.from({length:Math.min(totalPages,7)},(_,i)=>i+1).map(p=>(
                <button key={p} onClick={()=>setPage(p)} style={{padding:"4px 10px",border:"1px solid "+(page===p?"#1b5ea6":"#cde0f5"),borderRadius:6,background:page===p?"#1b5ea6":"#fff",color:page===p?"#fff":"#5a7a9a",fontWeight:page===p?600:400,fontSize:12}}>{p}</button>
              ))}
              <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page>=totalPages||totalPages===0} style={{padding:"4px 10px",border:"1px solid #cde0f5",borderRadius:6,background:"#fff",color:page>=totalPages?"#ccc":"#1b5ea6",fontSize:13}}>›</button>
            </div>
          </div>
        </Card>
      )}
    </div>

    {/* DRAWER */}
    <div style={{position:"fixed",inset:0,zIndex:500,display:drawer?"block":"none"}}>
      <div onClick={()=>setDrawer(false)} style={{position:"absolute",inset:0,background:"rgba(15,30,55,0.4)",backdropFilter:"blur(2px)"}}/>
      <div style={{position:"absolute",top:0,right:0,bottom:0,width:400,background:"#fff",display:"flex",flexDirection:"column",animation:drawer?"slideIn 0.28s cubic-bezier(0.4,0,0.2,1)":"",boxShadow:"-8px 0 40px rgba(27,94,166,0.18)"}}>
        <div style={{background:"#1b5ea6",padding:"16px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontSize:15,fontWeight:600,color:"#fff"}}>✏️ Tambah Konten Baru</div>
          <button onClick={()=>setDrawer(false)} style={{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:6,color:"#fff",width:28,height:28,fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:20}}>
          <div style={{marginBottom:14}}><label style={{display:"block",fontSize:10.5,letterSpacing:"0.8px",textTransform:"uppercase",color:"#5a7a9a",fontWeight:600,marginBottom:5}}>Judul / Topik Konten<span style={{color:"#e05c3a",marginLeft:2}}>*</span></label><input value={form.judul} onChange={e=>setForm(p=>({...p,judul:e.target.value}))} placeholder="cth. Recap SLH Maret 2026" style={inp}/></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <div style={{marginBottom:14}}><label style={{display:"block",fontSize:10.5,letterSpacing:"0.8px",textTransform:"uppercase",color:"#5a7a9a",fontWeight:600,marginBottom:5}}>Jenis</label><select value={form.jenis} onChange={e=>setForm(p=>({...p,jenis:e.target.value}))} style={inp}><option value="">— Pilih —</option>{JENIS_OPTS.map(o=><option key={o}>{o}</option>)}</select></div>
            <div style={{marginBottom:14}}><label style={{display:"block",fontSize:10.5,letterSpacing:"0.8px",textTransform:"uppercase",color:"#5a7a9a",fontWeight:600,marginBottom:5}}>PIC</label><select value={form.pic} onChange={e=>setForm(p=>({...p,pic:e.target.value}))} style={inp}><option value="">— Pilih —</option>{["Anhar","Sabin","Sandi"].map(o=><option key={o}>{o}</option>)}</select></div>
          </div>
          <div style={{marginBottom:14}}><label style={{display:"block",fontSize:10.5,letterSpacing:"0.8px",textTransform:"uppercase",color:"#5a7a9a",fontWeight:600,marginBottom:5}}>Pilar Konten</label><select value={form.pilar} onChange={e=>setForm(p=>({...p,pilar:e.target.value}))} style={inp}><option value="">— Pilih —</option>{PILAR_OPTS.map(o=><option key={o}>{o}</option>)}</select></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <div style={{marginBottom:14}}><label style={{display:"block",fontSize:10.5,letterSpacing:"0.8px",textTransform:"uppercase",color:"#5a7a9a",fontWeight:600,marginBottom:5}}>Platform</label><select value={form.platform} onChange={e=>setForm(p=>({...p,platform:e.target.value}))} style={inp}><option value="">— Pilih —</option>{PLATFORM_OPTS.map(o=><option key={o}>{o}</option>)}</select></div>
            <div style={{marginBottom:14}}><label style={{display:"block",fontSize:10.5,letterSpacing:"0.8px",textTransform:"uppercase",color:"#5a7a9a",fontWeight:600,marginBottom:5}}>Format</label><select value={form.format} onChange={e=>setForm(p=>({...p,format:e.target.value}))} style={inp}><option value="">— Pilih —</option>{FORMAT_OPTS.map(o=><option key={o}>{o}</option>)}</select></div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <div style={{marginBottom:14}}><label style={{display:"block",fontSize:10.5,letterSpacing:"0.8px",textTransform:"uppercase",color:"#5a7a9a",fontWeight:600,marginBottom:5}}>Status<span style={{color:"#e05c3a",marginLeft:2}}>*</span></label><select value={form.status} onChange={e=>setForm(p=>({...p,status:e.target.value}))} style={inp}><option value="">— Pilih —</option>{STATUS_OPTS.map(o=><option key={o}>{o}</option>)}</select></div>
            <div style={{marginBottom:14}}><label style={{display:"block",fontSize:10.5,letterSpacing:"0.8px",textTransform:"uppercase",color:"#5a7a9a",fontWeight:600,marginBottom:5}}>Tanggal</label><input type="date" value={form.tanggal} onChange={e=>setForm(p=>({...p,tanggal:e.target.value}))} style={inp}/></div>
          </div>
          <div style={{marginBottom:14}}><label style={{display:"block",fontSize:10.5,letterSpacing:"0.8px",textTransform:"uppercase",color:"#5a7a9a",fontWeight:600,marginBottom:5}}>Link Dokumentasi</label><input value={form.link} onChange={e=>setForm(p=>({...p,link:e.target.value}))} placeholder="https://…" style={inp}/></div>
        </div>
        <div style={{padding:"14px 20px",borderTop:"1px solid #cde0f5",display:"flex",gap:10,background:"#f4f8fd"}}>
          <button onClick={()=>setDrawer(false)} style={{padding:"10px 18px",border:"1.5px solid #cde0f5",borderRadius:8,background:"none",color:"#5a7a9a",fontSize:13}}>Batal</button>
          <button onClick={handleAdd} disabled={saving} style={{flex:1,padding:10,background:saving?"#7aa3c9":"#1b5ea6",color:"#fff",border:"none",borderRadius:8,fontWeight:600,fontSize:13}}>
            {saving?"Menyimpan…":"＋ Simpan Konten"}
          </button>
        </div>
      </div>
    </div>

    {/* MODAL */}
    {modal&&<div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(15,30,55,0.45)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(3px)"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:18,width:"90%",maxWidth:500,overflow:"hidden",animation:"fadeUp 0.2s",boxShadow:"0 8px 40px rgba(27,94,166,0.18)"}}>
        <div style={{background:"#1b5ea6",padding:"16px 20px",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
          <div style={{fontSize:15,fontWeight:600,color:"#fff",lineHeight:1.4}}>{modal.judul||"(Tanpa Judul)"}</div>
          <button onClick={()=>setModal(null)} style={{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:6,color:"#fff",width:28,height:28,fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
        </div>
        <div style={{padding:20}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
            {[["Jenis",modal.jenis],["Platform",modal.platform],["Pilar",modal.pilar],["Format",modal.format]].map(([l,v])=>(
              <div key={l}><div style={{fontSize:10,letterSpacing:"1px",textTransform:"uppercase",color:"#5a7a9a",fontWeight:600,marginBottom:4}}>{l}</div><div style={{fontSize:13,fontWeight:500}}>{v||"—"}</div></div>
            ))}
            <div><div style={{fontSize:10,letterSpacing:"1px",textTransform:"uppercase",color:"#5a7a9a",fontWeight:600,marginBottom:4}}>PIC</div><PicChip pic={modal.pic}/></div>
            <div><div style={{fontSize:10,letterSpacing:"1px",textTransform:"uppercase",color:"#5a7a9a",fontWeight:600,marginBottom:4}}>Status</div><Badge status={modal.status}/></div>
            <div><div style={{fontSize:10,letterSpacing:"1px",textTransform:"uppercase",color:"#5a7a9a",fontWeight:600,marginBottom:4}}>Tanggal</div><div style={{fontSize:13,fontWeight:500}}>{modal.tanggal?new Date(modal.tanggal).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}):"—"}</div></div>
            <div style={{gridColumn:"1/-1"}}><div style={{fontSize:10,letterSpacing:"1px",textTransform:"uppercase",color:"#5a7a9a",fontWeight:600,marginBottom:4}}>Link</div>
              {modal.link?.startsWith("http")?<a href={modal.link} target="_blank" rel="noreferrer" style={{color:"#2e7dd1",fontSize:12.5,wordBreak:"break-all"}}>🔗 {modal.link.slice(0,60)}{modal.link.length>60?"…":""}</a>:<span style={{color:"#aaa"}}>—</span>}
            </div>
          </div>
        </div>
      </div>
    </div>}

    {/* TOAST */}
    {toast&&<div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:toast.type==="error"?"#b91c1c":"#1a7a4a",color:"#fff",padding:"11px 22px",borderRadius:10,fontSize:13,fontWeight:500,zIndex:9999,boxShadow:"0 4px 20px rgba(0,0,0,0.2)",animation:"fadeUp 0.3s",whiteSpace:"nowrap"}}>
      {toast.msg}
    </div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
